<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>因数大作战 · 太空射击</title>
<style>
  :root{
    --accent:#2563eb;
    --accent2:#7c3aed;
    --ink:#0f172a;
    --sub:#64748b;
    --line:#e2e8f0;
    --card:#ffffff;
    --good:#16a34a;
    --warn:#ea580c;
    --bad:#dc2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#0b1026 0%,#16204a 55%,#1e2a5a 100%);
    display:flex; flex-direction:column; overflow:hidden;
    transition:background .5s;
  }
  body[data-theme="ocean"]{background:linear-gradient(160deg,#04293f 0%,#0b5e7a 55%,#0e7490 100%);}
  body[data-theme="candy"]{background:linear-gradient(160deg,#2a0a3a 0%,#5b1a6b 55%,#7c3aed 100%);}

  /* ===== 顶栏 ===== */
  header{
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; color:#fff; flex:0 0 auto;
  }
  header h1{
    font-size:20px; margin:0; flex:1;
    text-shadow:0 1px 6px rgba(0,0,0,.35);
    letter-spacing:1px;
  }
  header h1 .sub{font-size:12px; opacity:.8; font-weight:400; margin-left:8px;}
  .theme-dots{display:flex; gap:8px;}
  .theme-dot{
    width:22px; height:22px; border-radius:50%; cursor:pointer;
    border:2px solid rgba(255,255,255,.7); background:transparent; padding:0;
    transition:transform .15s;
  }
  .theme-dot:active{transform:scale(.85);}
  .theme-dot.space{background:linear-gradient(135deg,#0b1026,#3b5bdb);}
  .theme-dot.ocean{background:linear-gradient(135deg,#04293f,#22d3ee);}
  .theme-dot.candy{background:linear-gradient(135deg,#3b0d45,#f472b6);}
  .theme-dot.on{transform:scale(1.15); box-shadow:0 0 0 3px rgba(255,255,255,.35);}
  .icon-btn{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25);
    border-radius:10px; width:36px; height:36px; font-size:18px; cursor:pointer; line-height:1;
  }
  .icon-btn:active{transform:scale(.9);}

  /* ===== HUD ===== */
  #hud{
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    padding:6px 12px 10px; flex:0 0 auto;
  }
  .hud-card{
    background:rgba(255,255,255,.94); border-radius:14px; padding:6px 14px;
    min-width:82px; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .hud-card .k{font-size:11px; color:var(--sub);}
  .hud-card .v{font-size:20px; font-weight:800; line-height:1.2; color:var(--ink);}
  .hud-card.target .v{color:var(--accent2);}
  .hud-card.combo .v{color:var(--warn);}
  #hudLives{font-size:20px; letter-spacing:1px;}

  /* ===== 游戏区 ===== */
  #stage{flex:1 1 auto; position:relative; min-height:0; margin:0 12px;}
  #cv{position:absolute; inset:0; width:100%; height:100%; border-radius:18px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.08); display:block;}

  /* ===== 炮弹栏 ===== */
  #bulletBar{
    flex:0 0 auto; padding:10px 12px 14px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(56px, 1fr));
    gap:8px; max-width:760px; margin:0 auto; width:100%;
  }
  .bullet-btn{
    background:rgba(255,255,255,.95); border:2px solid var(--line); border-radius:12px;
    padding:10px 2px; font-size:17px; font-weight:800; cursor:pointer; color:var(--ink);
    transition:transform .06s, box-shadow .1s, background .1s;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
    user-select:none; font-family:inherit;
  }
  .bullet-btn:active{transform:scale(.88); background:#dbeafe; border-color:var(--accent);}
  .bullet-btn.big{font-size:15px;}
  .bullet-btn.xl{font-size:13px;}

  /* ===== 覆盖面板 ===== */
  .panel{
    position:absolute; inset:0; border-radius:18px; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:20px; text-align:center;
    background:rgba(9,13,34,.82); backdrop-filter:blur(4px); color:#fff;
  }
  .panel.hidden{display:none;}
  .panel h2{font-size:26px; margin:0; letter-spacing:2px;}
  .panel .tip{color:#cbd5e1; font-size:14px; max-width:420px; line-height:1.7;}
  .big-btn{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    border:none; border-radius:16px; padding:14px 40px; font-size:20px; font-weight:800;
    cursor:pointer; box-shadow:0 8px 20px rgba(37,99,235,.45); letter-spacing:2px;
    transition:transform .1s; font-family:inherit;
  }
  .big-btn:active{transform:scale(.94);}
  .ghost-btn{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:14px; padding:11px 26px; font-size:16px; font-weight:700; cursor:pointer;
    transition:transform .1s; font-family:inherit;
  }
  .ghost-btn:active{transform:scale(.94);}

  .level-pick{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .level-card{
    background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.25); border-radius:16px;
    padding:14px 22px; cursor:pointer; min-width:110px; transition:transform .12s, background .15s;
  }
  .level-card:hover{transform:translateY(-3px);}
  .level-card.sel{background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:#fff; box-shadow:0 6px 18px rgba(37,99,235,.5);}
  .level-card .n{font-size:26px; font-weight:900; letter-spacing:1px;}
  .level-card .b{font-size:12px; opacity:.85; margin-top:4px;}
  .badge{font-size:13px;}

  .stat-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .stat-box{background:rgba(255,255,255,.12); border-radius:12px; padding:10px 18px; min-width:90px;}
  .stat-box .n{font-size:24px; font-weight:900;}
  .stat-box .l{font-size:12px; opacity:.8;}
  .err-box{
    background:rgba(255,255,255,.1); border-radius:14px; padding:12px 18px;
    max-width:460px; width:100%; font-size:15px; line-height:1.9; max-height:150px; overflow:auto;
  }
  .err-box b{color:#fca5a5;}
  .row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}

  @media (max-width:480px){
    header h1{font-size:17px;}
    #bulletBar{grid-template-columns:repeat(auto-fill, minmax(48px,1fr));}
    .bullet-btn{font-size:15px; padding:8px 2px;}
  }
</style>
</head>
<body data-theme="space">
<!-- ===== 站点统一导航条 ===== -->
<div style="flex:0 0 auto;width:max-content;max-width:100%;margin:4px auto 2px;display:flex;align-items:center;gap:8px;padding:7px 9px;background:rgba(255,255,255,.92);border:1px solid rgba(15,23,42,.08);border-radius:999px;box-shadow:0 6px 18px rgba(15,23,42,.16);font:700 14px/1.2 'PingFang SC','Microsoft YaHei',system-ui,sans-serif;">
  <a href="index.html" style="display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:999px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;text-decoration:none;">🏠 首页</a>
  <span style="display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:#f1f5f9;color:#64748b;">🔢 数学 · 因数大作战</span>
</div>

<header>
  <h1>🚀 因数大作战 <span class="sub">看见一个数，打掉它的好朋友！</span></h1>
  <div class="theme-dots">
    <button class="theme-dot space on" data-t="space" title="太空"></button>
    <button class="theme-dot ocean" data-t="ocean" title="海底"></button>
    <button class="theme-dot candy" data-t="candy" title="糖果"></button>
  </div>
  <button class="icon-btn" id="btnMute" title="音效">🔊</button>
</header>

<div id="hud">
  <div class="hud-card target"><div class="k">本局目标</div><div class="v" id="hudTarget">凑 100</div></div>
  <div class="hud-card"><div class="k">得分</div><div class="v" id="hudScore">0</div></div>
  <div class="hud-card combo"><div class="k">连击</div><div class="v" id="hudCombo">0</div></div>
  <div class="hud-card"><div class="k">生命</div><div class="v" id="hudLives">🚀🚀🚀</div></div>
</div>

<div id="stage">
  <canvas id="cv"></canvas>

  <div class="panel" id="panelHome">
    <h2>🎯 因数大作战</h2>
    <p class="tip">太空里飘来一个个数字泡泡！<br>泡泡上是几，就点它的<b>好朋友</b>（两个数相乘 = 目标）。<br>打中得分，连击加分；泡泡飘出屏幕会丢一条命哦。</p>
    <div class="level-pick" id="levelPick"></div>
    <button class="big-btn" id="btnStart">🚀 开始闯关</button>
  </div>

  <div class="panel hidden" id="panelOver">
    <h2 id="overTitle">🛸 本局结束</h2>
    <div class="stat-row">
      <div class="stat-box"><div class="n" id="rScore">0</div><div class="l">得分</div></div>
      <div class="stat-box"><div class="n" id="rCombo">0</div><div class="l">最佳连击</div></div>
      <div class="stat-box"><div class="n" id="rRate">0%</div><div class="l">命中率</div></div>
    </div>
    <div id="rRecord" class="badge"></div>
    <div id="errWrap" style="display:none;">
      <div style="font-size:13px; opacity:.85; margin-bottom:4px;">📚 再练一练（答错 / 漏掉的好朋友）：</div>
      <div class="err-box" id="errList"></div>
    </div>
    <div class="row">
      <button class="big-btn" id="btnAgain">🔁 再来一局</button>
      <button class="ghost-btn" id="btnHome">🏠 换难度</button>
    </div>
  </div>
</div>

<div id="bulletBar"></div>

<script>
(function(){
  "use strict";

  /* ============ 数据：三档目标与全部因数对 ============ */
  var PAIRS = {
    60:   [[1,60],[2,30],[3,20],[4,15],[5,12],[6,10]],
    100:  [[1,100],[2,50],[4,25],[5,20],[10,10]],
    1000: [[1,1000],[2,500],[4,250],[5,200],[8,125],[10,100],[20,50],[25,40]]
  };
  var LEVELS = [60, 100, 1000];

  function factorList(t){
    var s = {};
    PAIRS[t].forEach(function(p){ s[p[0]]=1; s[p[1]]=1; });
    return Object.keys(s).map(Number).sort(function(a,b){ return a-b; });
  }

  /* ============ 皮肤色板 ============ */
  var THEMES = {
    space:{ bg1:"#0b1026", bg2:"#1e2a5a", star:"#c7d2fe", bubble:"#7c9dff", gold:"#fbbf24" },
    ocean:{ bg1:"#04293f", bg2:"#0e7490", star:"#a5f3fc", bubble:"#22d3ee", gold:"#fde047" },
    candy:{ bg1:"#2a0a3a", bg2:"#7c3aed", star:"#fde68a", bubble:"#f472b6", gold:"#fde047" }
  };

  /* ============ DOM ============ */
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var stage = document.getElementById("stage");
  var bulletBar = document.getElementById("bulletBar");
  var hudTarget = document.getElementById("hudTarget");
  var hudScore = document.getElementById("hudScore");
  var hudCombo = document.getElementById("hudCombo");
  var hudLives = document.getElementById("hudLives");
  var panelHome = document.getElementById("panelHome");
  var panelOver = document.getElementById("panelOver");
  var levelPick = document.getElementById("levelPick");
  var btnStart = document.getElementById("btnStart");
  var btnAgain = document.getElementById("btnAgain");
  var btnHome = document.getElementById("btnHome");
  var btnMute = document.getElementById("btnMute");
  var rScore=document.getElementById("rScore"), rCombo=document.getElementById("rCombo"),
      rRate=document.getElementById("rRate"), rRecord=document.getElementById("rRecord"),
      errWrap=document.getElementById("errWrap"), errList=document.getElementById("errList"),
      overTitle=document.getElementById("overTitle");

  /* ============ 游戏状态 ============ */
  var target = 100;
  var phase = "home";      // home | playing | ending | over
  var score = 0, combo = 0, bestCombo = 0, lives = 3;
  var hitCount = 0, whiffCount = 0, lostCount = 0;
  var bubbles = [], bullets = [], particles = [], floats = [], stars = [];
  var spawnTimer = 0, spawnCount = 0, errors = {}, newRecord = false;
  var muted = false;
  var W = 0, H = 0, dpr = 1;
  var curTheme = "space";
  var pendingEnd = null;
  var cannonTipX = 0, cannonTipY = 0;

  /* ============ 画布尺寸 ============ */
  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    initStars();
  }

  function initStars(){
    stars = [];
    var n = Math.floor(W * H / 6000);
    for(var i=0;i<n;i++){
      stars.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6+0.4,
                   tw:Math.random()*Math.PI*2, sp:Math.random()*2+1 });
    }
  }

  /* ============ 工具 ============ */
  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  /* ============ 音效 ============ */
  var AC = null;
  function beep(freq, dur, type, vol){
    if(muted) return;
    try{
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.value = vol || 0.12;
      o.connect(g); g.connect(AC.destination);
      var t = AC.currentTime;
      g.gain.setValueAtTime(vol||0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t); o.stop(t + dur);
    }catch(e){}
  }
  function sfx(kind){
    if(kind==="hit")  beep(660 + combo*60, 0.16, "triangle", 0.14);
    else if(kind==="gold") { beep(880,0.12,"triangle",0.14); setTimeout(function(){beep(1100,0.16,"triangle",0.14);},90); }
    else if(kind==="miss") beep(220, 0.22, "sawtooth", 0.06);
    else if(kind==="lose") beep(300, 0.4, "sawtooth", 0.08);
    else if(kind==="shoot") beep(520, 0.06, "square", 0.04);
    else if(kind==="boss") beep(440,0.14,"square",0.1);
  }

  /* ============ 泡泡生成 ============ */
  function spawnInterval(){
    var base = {60:3120, 100:2600, 1000:2080}[target];
    return Math.max(900, base - score*3);
  }
  function bubbleSpeed(){
    var base = {60:52, 100:72, 1000:104}[target];
    return base + Math.min(score*0.3, 85);
  }

  function spawnBubble(forceBoss){
    var pairs = PAIRS[target];
    var used = {};
    bubbles.forEach(function(b){ used[b.num]=1; });
    var pair = null, num = 0, tries = 0;
    do{
      pair = pick(pairs);
      num = Math.random() < 0.5 ? pair[0] : pair[1];
      tries++;
    }while(used[num] && tries < 20);

    var isBoss = !!forceBoss;
    var isGold = !isBoss && Math.random() < 0.14;
    var r = isBoss ? 50 : rand(30, 40);
    var bx = rand(r+14, W-r-14);
    var b = {
      num: num, baseX: bx, x: bx, y: H + r + 8,
      r: r, speed: isBoss ? bubbleSpeed()*0.55 : bubbleSpeed()*rand(0.9,1.15),
      wobAmp: rand(6,16), wobPh: Math.random()*Math.PI*2, wobSp: rand(1.2,2.4),
      isGold: isGold, isBoss: isBoss, alive: true,
      deadline: isBoss ? performance.now() + 5000 : 0
    };
    bubbles.push(b);
    if(isBoss) sfx("boss");
    return b;
  }

  /* ============ 射击 ============ */
  function fire(num){
    if(phase !== "playing") return;
    var partner = target / num;
    var cand = bubbles.filter(function(b){ return b.alive && b.num === partner; });
    sfx("shoot");

    if(cand.length === 0){
      // 空炮：屏幕上没有 num 的搭档
      whiffCount++;
      combo = 0; updateHUD();
      showFloat("再想想："+num+" 和谁凑 "+target+" ？", "warn");
      sfx("miss");
      recordError(num, partner);
      return;
    }
    cand.sort(function(a,b){ return a.y - b.y; });
    var goal = cand[0];
    bullets.push({ x: cannonTipX, y: cannonTipY, num: num, goal: goal, speed: 620, alive: true });
  }

  function hitBubble(b, bulletNum){
    if(!b.alive) return;
    b.alive = false;
    hitCount++;
    combo++; bestCombo = Math.max(bestCombo, combo);
    var pts = b.isBoss ? 40 : (b.isGold ? 20 : 10);
    pts += combo * 2;
    score += pts;
    updateHUD();
    burst(b.x, b.y, b.isBoss ? "#f87171" : (b.isGold ? "#fbbf24" : "#7dd3fc"), b.isBoss ? 36 : (b.isGold ? 26 : 18));
    showFloat("✓ "+b.num+" × "+bulletNum+" = "+target, "good");
    if(b.isGold) sfx("gold"); else sfx("hit");
  }

  function missBubble(b){
    if(!b.alive) return;
    b.alive = false;
    lostCount++;
    combo = 0;
    lives--;
    updateHUD();
    burst(b.x, Math.max(b.y, 20), "#fca5a5", 14);
    var partner = target / b.num;
    showFloat("😢 跑了："+b.num+" 的好朋友是 "+partner, "bad");
    recordError(b.num, partner);
    sfx("lose");
    if(lives <= 0) endGame();
  }

  function recordError(a, b){
    var lo = Math.min(a,b), hi = Math.max(a,b);
    errors[lo+"×"+hi] = true;
  }

  /* ============ 结束 & 纪录 ============ */
  function loadBest(){
    try{
      return JSON.parse(localStorage.getItem("factorShooter.best") || "{}");
    }catch(e){ return {}; }
  }
  function saveBest(b){ try{ localStorage.setItem("factorShooter.best", JSON.stringify(b)); }catch(e){} }

  function endGame(){
    if(phase !== "playing") return;
    phase = "ending";
    var b = loadBest();
    var key = String(target);
    var prev = b[key] || { score:0, combo:0 };
    newRecord = score > prev.score;
    if(newRecord) b[key] = { score: score, combo: Math.max(bestCombo, prev.combo) };
    else if(bestCombo > prev.combo) b[key].combo = bestCombo;
    saveBest(b);
    pendingEnd = setTimeout(function(){
      phase = "over";
      showOver();
    }, 700);
  }

  function showOver(){
    overTitle.textContent = newRecord ? "🏆 新纪录！" : "🛸 本局结束";
    rScore.textContent = score;
    rCombo.textContent = bestCombo;
    var attempts = hitCount + whiffCount + lostCount;
    rRate.textContent = attempts > 0 ? Math.round(hitCount / attempts * 100) + "%" : "—";
    rRecord.textContent = newRecord ? "🎉 打破了该难度最高分纪录！" : "最高分：" + (loadBest()[String(target)] || {score:0}).score;
    var keys = Object.keys(errors);
    if(keys.length){
      errWrap.style.display = "block";
      var html = "";
      keys.forEach(function(k){
        var parts = k.split("×");
        html += "<b>"+parts[0]+" × "+parts[1]+" = "+target+"</b>　";
      });
      errList.innerHTML = html;
    } else {
      errWrap.style.display = "none";
    }
    panelOver.classList.remove("hidden");
    if(newRecord) launchFireworks();
    updateHomeBest();
  }

  /* ============ 烟花 ============ */
  function launchFireworks(){
    var waves = 0;
    var iv = setInterval(function(){
      var fx = rand(W*0.25, W*0.75), fy = rand(H*0.15, H*0.4);
      var cols = ["#fbbf24","#f472b6","#7dd3fc","#a3e635","#c084fc"];
      for(var i=0;i<60;i++){
        var a = Math.random()*Math.PI*2, sp = rand(40,180);
        particles.push({ x:fx, y:fy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
          life:rand(0.7,1.4), maxLife:1.4, size:rand(2,4), color:pick(cols), grav:40 });
      }
      waves++;
      beep(600+waves*120, 0.25, "triangle", 0.08);
      if(waves >= 5) clearInterval(iv);
    }, 260);
  }

  /* ============ 粒子 & 浮字 ============ */
  function burst(x, y, color, n){
    for(var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, sp = rand(60,260);
      particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:rand(0.4,0.9), maxLife:0.9, size:rand(2,4), color:color, grav:160 });
    }
  }
  function showFloat(text, kind){
    if(floats.length > 4) floats.shift();
    var colors = { good:"#4ade80", warn:"#fbbf24", bad:"#fca5a5" };
    floats.push({ text:text, y: H*0.32, life:1.4, maxLife:1.4, color: colors[kind] || "#fff" });
  }

  /* ============ HUD & 按钮 ============ */
  function updateHUD(){
    hudTarget.textContent = "凑 " + target;
    hudScore.textContent = score;
    hudCombo.textContent = combo;
    hudLives.textContent = "🚀".repeat(Math.max(0, lives)) + "💔".repeat(Math.max(0, 3-lives));
  }
  function buildBulletBar(){
    bulletBar.innerHTML = "";
    var fs = factorList(target);
    fs.forEach(function(n){
      var btn = document.createElement("button");
      btn.className = "bullet-btn" + (n >= 100 ? (n >= 1000 ? " xl" : " big") : "");
      btn.textContent = n;
      btn.addEventListener("click", function(){ fire(n); });
      bulletBar.appendChild(btn);
    });
  }
  /* ============ 主页难度选择 ============ */
  function updateHomeBest(){
    var best = loadBest();
    Array.prototype.forEach.call(levelPick.children, function(card){
      var t = Number(card.getAttribute("data-t"));
      var b = best[String(t)];
      var badge = card.querySelector(".b");
      badge.textContent = b ? ("最高 " + b.score + " 分") : "还没挑战";
    });
  }
  function buildLevelPick(){
    levelPick.innerHTML = "";
    var names = {60:"简单", 100:"进阶", 1000:"高手"};
    LEVELS.forEach(function(t){
      var card = document.createElement("div");
      card.className = "level-card" + (t===target ? " sel" : "");
      card.setAttribute("data-t", t);
      card.innerHTML = '<div class="n">凑 '+t+'</div><div class="b"></div>';
      card.addEventListener("click", function(){
        target = t;
        Array.prototype.forEach.call(levelPick.children, function(c){ c.classList.remove("sel"); });
        card.classList.add("sel");
      });
      levelPick.appendChild(card);
    });
    updateHomeBest();
  }

  /* ============ 开始 / 重开 ============ */
  function startGame(){
    score = 0; combo = 0; bestCombo = 0; lives = 3;
    hitCount = 0; whiffCount = 0; lostCount = 0;
    bubbles = []; bullets = []; particles = []; floats = [];
    spawnTimer = 800; spawnCount = 0; errors = {}; newRecord = false;
    phase = "playing";
    updateHUD();
    buildBulletBar();
    panelHome.classList.add("hidden");
    panelOver.classList.add("hidden");
  }

  /* ============ 主题 ============ */
  function applyTheme(t){
    curTheme = t;
    document.body.setAttribute("data-theme", t);
    Array.prototype.forEach.call(document.querySelectorAll(".theme-dot"), function(d){
      d.classList.toggle("on", d.getAttribute("data-t") === t);
    });
  }

  /* ============ 主循环 ============ */
  function update(dt){
    if(phase === "playing"){
      // 生成
      spawnTimer -= dt*1000;
      if(spawnTimer <= 0){
        spawnCount++;
        var forceBoss = (spawnCount % 8 === 0);
        spawnBubble(forceBoss);
        spawnTimer = spawnInterval();
      }
      // 泡泡移动
      var speed = bubbleSpeed();
      for(var i=bubbles.length-1;i>=0;i--){
        var b = bubbles[i];
        if(!b.alive){ continue; }
        b.wobPh += b.wobSp * dt;
        b.x = b.baseX + Math.sin(b.wobPh) * b.wobAmp;
        b.y -= b.speed * dt;
        if(b.isBoss && performance.now() > b.deadline){
          missBubble(b); continue;
        }
        if(b.y < -b.r) missBubble(b);
      }
      bubbles = bubbles.filter(function(b){ return b.alive; });

      // 子弹
      for(var j=bullets.length-1;j>=0;j--){
        var u = bullets[j];
        if(u.goal && u.goal.alive){
          var dx = u.goal.x - u.x, dy = u.goal.y - u.y;
          var d = Math.sqrt(dx*dx+dy*dy);
          if(d < u.goal.r + 10){ hitBubble(u.goal, u.num); u.alive = false; }
          else { u.x += dx/d * u.speed * dt; u.y += dy/d * u.speed * dt; }
        } else {
          u.y -= u.speed * dt;
          if(u.y < -20) u.alive = false;
        }
      }
      bullets = bullets.filter(function(b){ return b.alive; });
    }

    // 粒子 & 浮字（所有阶段都更新）
    for(var p=particles.length-1;p>=0;p--){
      var pt = particles[p];
      pt.life -= dt; if(pt.life<=0){ particles.splice(p,1); continue; }
      pt.vy += pt.grav * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    }
    for(var f=floats.length-1;f>=0;f--){
      floats[f].life -= dt; floats[f].y -= 26*dt;
      if(floats[f].life <= 0) floats.splice(f,1);
    }
  }

  function drawWheel(x, y, r, t){
    // 外胎
    ctx.fillStyle = "#1f2937";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#4b5563"; ctx.lineWidth = 2; ctx.stroke();
    // 轮毂
    ctx.fillStyle = "#9ca3af";
    ctx.beginPath(); ctx.arc(x, y, r*0.55, 0, Math.PI*2); ctx.fill();
    // 轮轴
    ctx.fillStyle = "#374151";
    ctx.beginPath(); ctx.arc(x, y, r*0.2, 0, Math.PI*2); ctx.fill();
    // 辐条（缓缓转动）
    var spin = t/400;
    ctx.strokeStyle = "#6b7280"; ctx.lineWidth = 2;
    for(var i=0;i<4;i++){
      var a = spin + i*Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a)*r*0.5, y + Math.sin(a)*r*0.5);
      ctx.lineTo(x + Math.cos(a)*r*0.95, y + Math.sin(a)*r*0.95);
      ctx.stroke();
    }
  }

  function drawCannon(t){
    var th = THEMES[curTheme];
    var cx = W/2;
    var groundY = H - 4;
    var wheelR = 13;
    var wheelY = groundY - wheelR;

    // 地面阴影
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath(); ctx.ellipse(cx, groundY+3, 42, 5, 0, 0, Math.PI*2); ctx.fill();

    // 两个轮子
    drawWheel(cx-19, wheelY, wheelR, t);
    drawWheel(cx+19, wheelY, wheelR, t);

    // 炮架（梯形车身）
    var carTopY = wheelY - 24;
    var carBotY = wheelY - 3;
    var cg = ctx.createLinearGradient(0, carTopY, 0, carBotY);
    cg.addColorStop(0, "#fbbf24"); cg.addColorStop(1, "#b45309");
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(cx-21, carBotY);
    ctx.lineTo(cx-11, carTopY);
    ctx.lineTo(cx+11, carTopY);
    ctx.lineTo(cx+21, carBotY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#92400e"; ctx.lineWidth = 2; ctx.stroke();

    // 炮管（金属，斜向上，略偏右）
    var ang = -Math.PI/2 - 0.16;
    var bx = cx, by = carTopY + 3;
    var len = 36, halfW = 5;
    var tipX = bx + Math.cos(ang)*len;
    var tipY = by + Math.sin(ang)*len;
    var perpX = Math.cos(ang - Math.PI/2);
    var perpY = Math.sin(ang - Math.PI/2);
    var b1x = bx + perpX*halfW, b1y = by + perpY*halfW;
    var b2x = bx - perpX*halfW, b2y = by - perpY*halfW;
    var t1x = tipX + perpX*halfW, t1y = tipY + perpY*halfW;
    var t2x = tipX - perpX*halfW, t2y = tipY - perpY*halfW;

    // 管身渐变
    var bg = ctx.createLinearGradient(b1x, b1y, b2x, b2y);
    bg.addColorStop(0, "#f1f5f9"); bg.addColorStop(0.45, "#94a3b8"); bg.addColorStop(1, "#334155");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(b1x, b1y); ctx.lineTo(t1x, t1y); ctx.lineTo(t2x, t2y); ctx.lineTo(b2x, b2y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1.5; ctx.stroke();

    // 炮口环
    var mw = halfW + 3;
    var m1x = tipX + perpX*mw, m1y = tipY + perpY*mw;
    var m2x = tipX - perpX*mw, m2y = tipY - perpY*mw;
    var ddx = Math.cos(ang)*5, ddy = Math.sin(ang)*5;
    var e1x = m1x + ddx, e1y = m1y + ddy;
    var e2x = m2x + ddx, e2y = m2y + ddy;
    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.moveTo(m1x, m1y); ctx.lineTo(e1x, e1y); ctx.lineTo(e2x, e2y); ctx.lineTo(m2x, m2y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.5; ctx.stroke();

    // 炮口发光
    var pulse = 0.5 + 0.5*Math.sin(t/180);
    var mx = tipX + ddx, my = tipY + ddy;
    var glow = ctx.createRadialGradient(mx, my, 1, mx, my, 11 + pulse*5);
    glow.addColorStop(0, "rgba(255,255,255,0.9)");
    glow.addColorStop(1, "rgba(125,211,252,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(mx, my, 11 + pulse*5, 0, Math.PI*2); ctx.fill();

    // 记录炮口坐标供射击
    cannonTipX = mx; cannonTipY = my;
  }

  function render(t){
    var th = THEMES[curTheme];
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, th.bg1); g.addColorStop(1, th.bg2);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // 星星
    ctx.fillStyle = th.star;
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var tw = 0.4 + 0.6*Math.abs(Math.sin(t/1000*s.sp + s.tw));
      ctx.globalAlpha = tw;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 泡泡
    for(var j=0;j<bubbles.length;j++){
      var b = bubbles[j];
      // 光晕
      var gr = ctx.createRadialGradient(b.x, b.y, b.r*0.2, b.x, b.y, b.r);
      var c1 = b.isBoss ? "#ef4444" : (b.isGold ? th.gold : th.bubble);
      gr.addColorStop(0, c1); gr.addColorStop(1, "rgba(255,255,255,0.05)");
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = b.isBoss ? "#fca5a5" : "rgba(255,255,255,.7)";
      ctx.lineWidth = b.isBoss ? 3 : 1.5;
      ctx.stroke();
      // 数字
      ctx.fillStyle = b.isBoss ? "#fff" : "#0f172a";
      ctx.font = "800 " + (b.isBoss ? 26 : 20) + "px system-ui";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(b.num), b.x, b.y);
      // 金泡泡星星角
      if(b.isGold){
        ctx.fillStyle = "#fff";
        ctx.font = "13px system-ui";
        ctx.fillText("⭐", b.x - b.r*0.55, b.y - b.r*0.6);
      }
      // Boss 倒计时
      if(b.isBoss){
        var left = Math.max(0, (b.deadline - performance.now())/1000);
        ctx.fillStyle = "#fecaca";
        ctx.font = "700 13px system-ui";
        ctx.fillText("⏳ " + left.toFixed(1), b.x, b.y - b.r - 12);
      }
    }

    // 子弹
    for(var k=0;k<bullets.length;k++){
      var u = bullets[k];
      var gr2 = ctx.createRadialGradient(u.x,u.y,1,u.x,u.y,10);
      gr2.addColorStop(0,"#ffffff"); gr2.addColorStop(1, th.bubble);
      ctx.fillStyle = gr2;
      ctx.beginPath(); ctx.arc(u.x,u.y,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#0f172a";
      ctx.font = "800 11px system-ui";
      ctx.fillText(String(u.num), u.x, u.y+0.5);
    }

    // 炮台
    drawCannon(t);

    // 粒子
    for(var p=0;p<particles.length;p++){
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life/pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    // 浮字
    for(var f=0;f<floats.length;f++){
      var fl = floats[f];
      ctx.globalAlpha = Math.max(0, fl.life/fl.maxLife);
      ctx.fillStyle = fl.color;
      ctx.font = "800 22px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(fl.text, W/2, fl.y);
    }
    ctx.globalAlpha = 1;
  }

  var lastT = 0;
  function loop(t){
    var dt = Math.min(0.05, (t - lastT)/1000 || 0.016);
    lastT = t;
    update(dt);
    render(t);
    requestAnimationFrame(loop);
  }

  /* ============ 事件绑定 ============ */
  window.addEventListener("resize", resize);
  btnStart.addEventListener("click", startGame);
  btnAgain.addEventListener("click", startGame);
  btnHome.addEventListener("click", function(){
    phase = "home";
    panelOver.classList.add("hidden");
    panelHome.classList.remove("hidden");
    bubbles = []; bullets = []; particles = []; floats = [];
    updateHomeBest();
  });
  btnMute.addEventListener("click", function(){
    muted = !muted;
    btnMute.textContent = muted ? "🔇" : "🔊";
  });
  Array.prototype.forEach.call(document.querySelectorAll(".theme-dot"), function(d){
    d.addEventListener("click", function(){ applyTheme(d.getAttribute("data-t")); });
  });

  /* ============ 启动 ============ */
  resize();
  buildLevelPick();
  buildBulletBar();
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
