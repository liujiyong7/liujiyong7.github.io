<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前后鼻音小达人 · 记一记 · 学一学 · 测一测</title>
<style>
  :root {
    --sky: #4FC3F7;
    --sky-deep: #29B6F6;
    --mint: #66BB6A;
    --mint-deep: #43A047;
    --sun: #FFCA28;
    --coral: #FF7043;
    --ink: #37474F;
    --ink-soft: #607D8B;
    --card: #ffffff;
    --bg-a: #E8F7FF;
    --bg-b: #EAFBF0;
    --good: #43A047;
    --bad: #E53935;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, var(--bg-a) 0%, #f0fbf5 50%, var(--bg-b) 100%);
    min-height: 100vh;
    color: var(--ink);
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 780px;
    margin: 0 auto;
  }

  /* ===== 顶部标题 ===== */
  header.title {
    text-align: center;
    margin: 10px 0 18px;
  }
  header.title h1 {
    font-size: 34px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--sky-deep), var(--mint-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  header.title p {
    margin-top: 6px;
    font-size: 15px;
    color: var(--ink-soft);
  }

  /* ===== Tabs ===== */
  .tabs {
    display: flex;
    gap: 14px;
    margin: 0 auto 20px;
    max-width: 660px;
  }
  .tab {
    flex: 1;
    font-size: 24px;
    font-weight: 800;
    padding: 16px 10px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    background: rgba(255,255,255,0.75);
    color: var(--ink-soft);
    box-shadow: 0 6px 14px rgba(0,0,0,0.06);
    transition: transform .15s ease, box-shadow .15s ease, background .25s ease, color .25s ease;
  }
  .tab:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.10); }
  .tab:active { transform: scale(0.97); }
  .tab.active {
    background: linear-gradient(135deg, var(--sky), var(--sky-deep));
    color: #fff;
    box-shadow: 0 8px 20px rgba(41,182,246,0.45);
  }
  .tab.tab-test.active {
    background: linear-gradient(135deg, var(--mint), var(--mint-deep));
    box-shadow: 0 8px 20px rgba(67,160,71,0.45);
  }
  .tab.tab-learned.active {
    background: linear-gradient(135deg, #FFB300, #FB8C00);
    box-shadow: 0 8px 20px rgba(251,140,0,0.45);
  }

  .panel {
    display: none;
    animation: fadeIn .35s ease;
  }
  .panel.show { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(55,71,79,0.10);
    margin-bottom: 16px;
  }

  /* ===== 记一记 ===== */
  .tab.tab-memory.active {
    background: linear-gradient(135deg, #AB47BC, #7B1FA2);
    box-shadow: 0 8px 20px rgba(123,31,162,0.45);
  }
  .memory-intro { text-align: center; }
  .memory-h2 {
    font-size: 26px;
    font-weight: 900;
    background: linear-gradient(90deg, #AB47BC, #7B1FA2);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  .memory-sub { margin-top: 6px; font-size: 15px; color: var(--ink-soft); }

  .memory-section { padding: 20px; border-top: 6px solid var(--sec); }
  .memory-sec-head {
    display: inline-block;
    font-size: 19px;
    font-weight: 900;
    padding: 7px 16px;
    border-radius: 999px;
    background: var(--sec-soft);
    color: var(--sec);
    margin-bottom: 14px;
  }
  .jingle-banner {
    border: 3px dashed var(--sec);
    background: var(--sec-soft);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 18px;
    text-align: center;
  }
  .jingle-label {
    font-size: 14px;
    font-weight: 800;
    color: var(--sec);
    opacity: 0.8;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .jingle-text {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .jingle-pill {
    font-size: 22px;
    font-weight: 900;
    background: #fff;
    color: var(--sec);
    border-radius: 14px;
    padding: 10px 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    letter-spacing: 2px;
  }
  .family-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 14px;
  }
  .family-card {
    background: #fff;
    border: 2px solid #ECEFF1;
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .family-card:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,0.08); }
  .family-card.important { border-color: #FFCA28; background: #FFFDE7; }
  .family-head { display: flex; align-items: center; gap: 10px; }
  .family-char { font-size: 38px; font-weight: 900; line-height: 1; color: var(--sec); }
  .family-pinyin { font-size: 16px; font-weight: 700; color: var(--ink-soft); }
  .fam-star {
    margin-left: auto;
    font-size: 13px;
    font-weight: 800;
    background: #FFF3E0;
    color: #F57C00;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .family-members { display: flex; flex-wrap: wrap; gap: 6px; }
  .fam-chip {
    font-size: 19px;
    font-weight: 800;
    background: var(--sec-soft);
    border: 2px solid var(--sec);
    color: var(--sec);
    border-radius: 10px;
    padding: 1px 8px;
    line-height: 1.4;
  }
  .family-note { font-size: 15px; line-height: 1.6; color: #5D4037; }

  /* ===== 学一学 ===== */
  .learn-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .counter {
    font-size: 18px;
    font-weight: 800;
    color: var(--sky-deep);
    background: #E1F5FE;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .group-tag {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: var(--sun);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .group-tag.in { background: #29B6F6; }
  .group-tag.en { background: #FF7043; }
  .group-tag.an { background: #66BB6A; }
  .group-tag.uan { background: #AB47BC; }
  .group-tag.ian { background: #EC407A; }

  .progress-track {
    width: 100%;
    height: 14px;
    background: #E0F2F1;
    border-radius: 999px;
    overflow: hidden;
    margin: 10px 0 18px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--sky), var(--mint));
    border-radius: 999px;
    transition: width .4s ease;
  }

  .big-char {
    text-align: center;
    font-size: 130px;
    line-height: 1.1;
    font-weight: 900;
    color: var(--ink);
    margin: 6px 0;
    text-shadow: 0 4px 0 rgba(79,195,247,0.15);
  }

  .words {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 4px 0 22px;
  }
  .words .hl {
    color: var(--bad);
    font-weight: 900;
    text-decoration: underline;
    text-decoration-color: rgba(229,57,53,0.4);
    text-underline-offset: 5px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 8px;
  }
  .opt-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 27px;
    font-weight: 800;
    padding: 18px 22px;
    border: 3px solid #E3F2FD;
    border-radius: 18px;
    background: #F4FBFF;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: transform .12s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease;
  }
  .opt-btn .opt-label {
    flex: 0 0 auto;
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--sky);
    color: #fff;
    border-radius: 12px;
    font-size: 20px;
  }
  .opt-btn .opt-pinyin { flex: 1; letter-spacing: 1px; }
  .opt-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(41,182,246,0.25); background: #E8F6FF; }
  .opt-btn:active { transform: scale(0.97); }

  .opt-btn.uncertain {
    border-color: #FFF3E0;
    background: #FFF8F0;
    justify-content: center;
    color: var(--coral);
  }
  .opt-btn.uncertain .opt-label { background: var(--sun); color: #6d4c00; }
  .opt-btn.uncertain:hover { background: #FFF1DE; box-shadow: 0 10px 22px rgba(255,202,40,0.3); }

  .opt-btn.is-correct {
    border-color: var(--good);
    background: #E8F8E9;
    color: var(--good);
    box-shadow: 0 0 0 4px rgba(67,160,71,0.18);
    animation: pop .35s ease;
  }
  .opt-btn.is-correct .opt-label { background: var(--good); }
  .opt-btn.disabled {
    opacity: 0.5;
    pointer-events: none;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* 反馈与记忆卡 */
  .feedback {
    display: none;
    margin-top: 16px;
  }
  .feedback.show { display: block; animation: fadeIn .35s ease; }

  .success-box {
    background: linear-gradient(135deg, #E8F8E9, #C8E6C9);
    border: 3px solid var(--good);
    border-radius: 18px;
    padding: 16px 18px;
    text-align: center;
    font-size: 26px;
    font-weight: 900;
    color: var(--good);
  }

  .tip-card {
    background: #FFF8E1;
    border: 3px dashed var(--sun);
    border-radius: 18px;
    padding: 18px;
    margin-top: 14px;
    animation: fadeIn .4s ease;
  }
  .tip-card .tip-title {
    font-size: 21px;
    font-weight: 900;
    color: #B26A00;
    margin-bottom: 8px;
  }
  .tip-card .tip-body {
    font-size: 20px;
    line-height: 1.7;
    color: #6d4c00;
  }
  .jingle {
    margin-top: 12px;
    background: #E3F2FD;
    border: 2px solid #90CAF9;
    border-radius: 14px;
    padding: 12px 14px;
  }
  .jingle .jingle-title {
    font-weight: 900;
    font-size: 18px;
    color: #0D47A1;
    margin-bottom: 6px;
  }
  .jingle .jingle-body {
    font-size: 18px;
    line-height: 1.9;
    color: #0D47A1;
  }
  .jingle .jingle-body b { color: #1565C0; }

  /* 选项 + 下一个：左右并排，按钮紧贴选项右边 */
  .learn-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .learn-row .options {
    flex: 1;
    min-width: 0;
    margin-bottom: 0;
  }
  .next-btn {
    display: none;
    flex: 0 0 auto;
    align-self: center;
    font-size: 24px;
    font-weight: 900;
    padding: 18px 20px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--mint), var(--mint-deep));
    color: #fff;
    box-shadow: 0 8px 20px rgba(67,160,71,0.4);
    transition: transform .12s ease, box-shadow .12s ease;
    animation: pop .35s ease;
  }
  .next-btn.show { display: inline-flex; align-items: center; gap: 8px; }
  .next-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 26px rgba(67,160,71,0.5); }
  .next-btn:active { transform: scale(0.95); }
  .next-btn .kbd {
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    background: rgba(255,255,255,0.28);
    padding: 5px 9px;
    border-radius: 8px;
    letter-spacing: 0;
  }

  /* ===== 测一测 ===== */
  .test-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .q-counter {
    font-size: 20px;
    font-weight: 800;
    color: var(--mint-deep);
    background: #E8F5E9;
    padding: 8px 16px;
    border-radius: 999px;
  }
  .test-char-wrap {
    text-align: center;
    margin: 4px 0 14px;
  }
  .test-char-wrap .big-char { font-size: 110px; margin: 4px 0; }

  .test-opt {
    border-color: #E8F5E9;
    background: #F5FBF6;
  }
  .test-opt .opt-label { background: var(--mint); }
  .test-opt:hover { background: #EAF6EC; box-shadow: 0 10px 22px rgba(102,187,106,0.25); }
  .test-opt.chosen {
    border-color: var(--mint-deep);
    background: #E3F5E5;
    color: var(--mint-deep);
    box-shadow: 0 0 0 4px rgba(102,187,106,0.18);
  }
  .test-opt.chosen .opt-label { background: var(--mint-deep); }

  .nav-btns {
    display: flex;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .nav-btn {
    flex: 1;
    font-size: 21px;
    font-weight: 800;
    padding: 14px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    background: #ECEFF1;
    color: var(--ink);
    transition: transform .12s ease, background .2s ease;
  }
  .nav-btn:hover { background: #E0E4E7; transform: translateY(-2px); }
  .nav-btn:active { transform: scale(0.97); }
  .nav-btn:disabled { opacity: 0.4; pointer-events: none; }

  .submit-btn {
    display: none;
    width: 100%;
    margin-top: 16px;
    font-size: 28px;
    font-weight: 900;
    padding: 18px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--coral), #F4511E);
    color: #fff;
    box-shadow: 0 8px 22px rgba(244,81,30,0.4);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .submit-btn.show { display: block; animation: fadeIn .4s ease; }
  .submit-btn:hover { transform: translateY(-3px); }
  .submit-btn:active { transform: scale(0.97); }

  /* 成绩单 */
  .report { display: none; }
  .report.show { display: block; animation: fadeIn .4s ease; }
  .score-hero {
    text-align: center;
    padding: 8px 0 4px;
  }
  .score-num {
    font-size: 80px;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, var(--sky-deep), var(--mint-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .score-label { font-size: 18px; color: var(--ink-soft); margin-top: 2px; }
  .praise {
    font-size: 30px;
    font-weight: 900;
    margin: 12px 0 6px;
    color: var(--coral);
  }
  .score-sub { font-size: 18px; color: var(--ink-soft); }

  .wrong-title {
    font-size: 25px;
    font-weight: 900;
    margin: 22px 0 12px;
    color: var(--bad);
    text-align: center;
  }
  .perfect-note {
    text-align: center;
    font-size: 22px;
    color: var(--good);
    font-weight: 800;
    margin: 8px 0 20px;
  }

  .wrong-card {
    background: #FFF5F5;
    border: 2px solid #FFCDD2;
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .wrong-card .wrong-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .wrong-card .wrong-zi {
    font-size: 42px;
    font-weight: 900;
    color: var(--ink);
  }
  .wrong-card .wrong-line {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }
  .wrong-card .wrong-line .ur { color: var(--bad); }
  .wrong-card .wrong-line .ok { color: var(--good); }
  .wrong-card .tip-card { margin-top: 12px; background: #FFFDE7; }

  .reset-btn {
    display: block;
    margin: 18px auto 0;
    font-size: 22px;
    font-weight: 800;
    padding: 14px 40px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: var(--sky);
    color: #fff;
    box-shadow: 0 8px 18px rgba(79,195,247,0.4);
    transition: transform .12s ease;
  }
  .reset-btn:hover { transform: translateY(-3px); }
  .reset-btn:active { transform: scale(0.96); }

  /* ===== 已学会 ===== */
  .learned-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .learned-head .counter {
    background: #FFF3E0;
    color: #E65100;
  }
  .learned-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 14px;
  }
  .learned-card {
    background: #F6FFFA;
    border: 2px solid #C8E6C9;
    border-radius: 18px;
    padding: 14px 14px 16px;
    text-align: center;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .learned-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(67,160,71,0.15); }
  .learned-card .l-zi {
    font-size: 52px;
    font-weight: 900;
    line-height: 1.1;
    color: var(--ink);
  }
  .learned-card .l-pinyin {
    font-size: 22px;
    font-weight: 800;
    color: var(--mint-deep);
    margin: 2px 0;
  }
  .learned-card .l-group {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    padding: 2px 9px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .learned-card .l-words {
    font-size: 17px;
    color: var(--ink-soft);
    margin: 4px 0 12px;
    line-height: 1.5;
  }
  .learned-card .l-words .hl { color: var(--bad); font-weight: 900; }
  .remove-btn {
    font-size: 16px;
    font-weight: 800;
    padding: 8px 16px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: #FFEBEE;
    color: var(--bad);
    transition: transform .12s ease, background .2s ease;
  }
  .remove-btn:hover { background: #FFCDD2; transform: translateY(-2px); }
  .remove-btn:active { transform: scale(0.95); }
  .clear-all-btn {
    margin-left: auto;
    font-size: 16px;
    font-weight: 800;
    padding: 9px 18px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: #FFEBEE;
    color: var(--bad);
    transition: transform .12s ease, background .2s ease;
  }
  .clear-all-btn:hover { background: #FFCDD2; transform: translateY(-2px); }
  .clear-all-btn:active { transform: scale(0.95); }
  .clear-all-btn:disabled { opacity: 0.45; pointer-events: none; }
  .learned-empty {
    text-align: center;
    font-size: 22px;
    color: var(--ink-soft);
    padding: 40px 10px;
  }
  .learned-empty .big { font-size: 60px; display: block; margin-bottom: 10px; }
  .learned-note {
    margin-top: 16px;
    font-size: 15px;
    color: var(--ink-soft);
    text-align: center;
  }

  footer {
    text-align: center;
    margin: 24px 0 10px;
    color: #90A4AE;
    font-size: 14px;
  }

  @media (max-width: 520px) {
    header.title h1 { font-size: 27px; }
    .tabs { flex-wrap: wrap; gap: 10px; }
    .tab { flex: 1 1 42%; font-size: 18px; padding: 12px 6px; }
    .jingle-pill { font-size: 19px; padding: 9px 12px; }
    .big-char { font-size: 100px; }
    .test-char-wrap .big-char { font-size: 90px; }
    .words { font-size: 25px; }
    .opt-btn { font-size: 22px; padding: 15px 16px; }
    .opt-btn .opt-label { width: 38px; height: 38px; font-size: 17px; }
    .learn-row { flex-direction: column; align-items: stretch; }
    .next-btn { width: 100%; justify-content: center; font-size: 22px; padding: 15px 18px; }
  }
</style>
</head>
<body>
<!-- ===== 站点统一导航条 ===== -->
<div style="position:sticky;top:0;z-index:9999;width:max-content;max-width:100%;margin:0 auto 12px;display:flex;align-items:center;gap:8px;padding:7px 9px;background:rgba(255,255,255,.92);border:1px solid rgba(15,23,42,.08);border-radius:999px;box-shadow:0 6px 18px rgba(15,23,42,.16);font:700 14px/1.2 'PingFang SC','Microsoft YaHei',system-ui,sans-serif;">

/* 扁平化：每个字附带所属组名 */
const DATA = [];
GROUPS.forEach(function (g) {
  g.chars.forEach(function (c) {
    DATA.push({ zi: c.zi, correct: c.correct, wrong: c.wrong, words: c.words, hook: c.hook, group: g.name });
  });
});
const TOTAL = DATA.length;

/* 判断该字正确读音是前鼻音还是后鼻音（-n 结尾 = 前鼻音，-ng 结尾 = 后鼻音） */
function isBack(item) { return /ng$/.test(item.correct); }

function muscleText(item) {
  const g = GROUPS.find(function (x) { return x.name === item.group; });
  if (!g) return '';
  return isBack(item) ? g.back : g.front;
}
function buildTip(item) {
  let tip = muscleText(item) + item.hook;
  const g = GROUPS.find(function (x) { return x.name === item.group; });
  // in组 前鼻音（收 n）生字常混，附上顺口溜帮助记忆
  if (g && g.jingleFront && !isBack(item)) {
    tip += '<div class="jingle"><div class="jingle-title">🎶 in组前鼻音顺口溜</div><div class="jingle-body">' + g.jingleFront + '</div></div>';
  }
  return tip;
}

/* ================= 已学会状态（localStorage 持久化） ================= */
const STORAGE_KEY = 'dsh.qianhoubiyin.learned.v1';
const GROUP_COLOR = { 'in组': '#29B6F6', 'en组': '#FF7043', 'an组': '#66BB6A', 'uan组': '#AB47BC', 'ian组': '#EC407A' };
let LEARNED = {};   // zi -> true（已学会）
let STREAKS = {};   // zi -> 连续正确次数

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      LEARNED = s.learned || {};
      STREAKS = s.streaks || {};
    }
  } catch (e) { LEARNED = {}; STREAKS = {}; }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ learned: LEARNED, streaks: STREAKS })); } catch (e) {}
}
function isLearned(zi) { return !!LEARNED[zi]; }
function getActive() { return DATA.filter(function (d) { return !isLearned(d.zi); }); }

/* ================= 通用工具 ================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// 组词里的目标字标红加粗（全部出现处都突出）
function highlightWords(item) {
  return item.words.map(function (w) {
    return w.split(item.zi).join('<span class="hl">' + item.zi + '</span>');
  }).join('　');
}

/* ================= Tab 切换 ================= */
function switchTab(which) {
  const map = {
    memory: { panel: 'memoryPanel', tab: 'tabMemory' },
    learn: { panel: 'learnPanel', tab: 'tabLearn' },
    test: { panel: 'testPanel', tab: 'tabTest' },
    learned: { panel: 'learnedPanel', tab: 'tabLearned' }
  };
  Object.keys(map).forEach(function (k) {
    document.getElementById(map[k].panel).classList.toggle('show', k === which);
    document.getElementById(map[k].tab).classList.toggle('active', k === which);
  });
  if (which !== 'learn') {
    document.getElementById('learnNext').classList.remove('show'); // 离开学一学时收起“下一个”
  }
  if (which === 'learned') {
    renderLearned();
  }
}

/* ================= 板块一：学一学 ================= */
let learnIndex = 0;
let learnRevealed = false;
let learnAnswered = false;
let learnOptions = [];
let learnActive = [];
let learnCorrectEl = null, learnWrongEl = null, learnUncertainEl = null;

function renderLearn() {
  const act = getActive();
  if (act.length === 0) { showLearnEmpty(); return; }
  if (learnIndex >= act.length) learnIndex = 0;
  const item = act[learnIndex];
  learnActive = act;

  learnRevealed = false;
  learnAnswered = false;
  learnOptions = shuffle([
    { pinyin: item.correct, isCorrect: true },
    { pinyin: item.wrong, isCorrect: false }
  ]);

  document.getElementById('learnCounter').textContent = (learnIndex + 1) + ' / ' + act.length;
  const gt = document.getElementById('learnGroup');
  gt.textContent = item.group;
  gt.className = 'group-tag ' + item.group.replace('组', '');
  document.getElementById('learnFill').style.width = (learnIndex / act.length * 100) + '%';
  document.getElementById('learnChar').textContent = item.zi;
  document.getElementById('learnWords').innerHTML = highlightWords(item);

  const wrap = document.getElementById('learnOptions');
  wrap.innerHTML = '';
  const labels = ['A', 'B'];
  learnCorrectEl = null; learnWrongEl = null;
  learnOptions.forEach(function (opt, idx) {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = '<span class="opt-label">' + labels[idx] + '</span><span class="opt-pinyin">' + opt.pinyin + '</span>';
    btn.onclick = function () { handleLearnOption(btn, opt.isCorrect); };
    wrap.appendChild(btn);
    if (opt.isCorrect) learnCorrectEl = btn; else learnWrongEl = btn;
  });
  const unc = document.createElement('button');
  unc.className = 'opt-btn uncertain';
  unc.innerHTML = '<span class="opt-label">C</span><span class="opt-pinyin">不确定 🤔</span>';
  unc.onclick = function () { handleLearnOption(unc, false); };
  wrap.appendChild(unc);
  learnUncertainEl = unc;

  document.getElementById('learnFeedback').classList.remove('show');
  document.getElementById('learnSuccess').style.display = 'none';
  document.getElementById('learnTip').style.display = 'none';
  document.getElementById('learnNext').classList.remove('show');
}

function showLearnEmpty() {
  document.getElementById('learnCounter').textContent = '0 / 0';
  const gt = document.getElementById('learnGroup');
  gt.textContent = '全部学会';
  gt.className = 'group-tag';
  document.getElementById('learnFill').style.width = '100%';
  document.getElementById('learnChar').textContent = '🎉';
  document.getElementById('learnWords').innerHTML = '太棒啦，所有生字都已经学会咯！';
  document.getElementById('learnOptions').innerHTML = '';
  document.getElementById('learnFeedback').classList.remove('show');
  document.getElementById('learnSuccess').style.display = 'none';
  document.getElementById('learnTip').style.display = 'none';
  document.getElementById('learnNext').classList.remove('show');
}

function handleLearnOption(el, isCorrect) {
  if (learnAnswered) return;
  const item = learnActive[learnIndex];

  if (!isCorrect) {
    if (learnRevealed) return;
    learnRevealed = true;
    learnCorrectEl.classList.add('is-correct');
    const tip = document.getElementById('learnTip');
    tip.innerHTML = '<div class="tip-title">💡 拼音小魔法（记忆法）</div><div class="tip-body">' + buildTip(item) + '</div>';
    tip.style.display = 'block';
    document.getElementById('learnFeedback').classList.add('show');
    return;
  }

  learnAnswered = true;
  learnCorrectEl.classList.add('is-correct');
  learnWrongEl.classList.add('disabled');
  learnUncertainEl.classList.add('disabled');

  document.getElementById('learnSuccess').style.display = 'block';
  document.getElementById('learnFeedback').classList.add('show');
  document.getElementById('learnNext').classList.add('show');
}

function nextLearn() {
  const act = getActive();
  if (act.length === 0) { showLearnEmpty(); return; }
  learnIndex = (learnIndex + 1) % act.length;
  renderLearn();
}

const TEST_SIZE = 50;   // 每次随机抽取 50 个字测试
let testOrder = [];
let testOptions = [];
let testAnswers = [];
let testQ = 0;

function startTest() {
  const actIdx = [];
  DATA.forEach(function (d, i) { if (!isLearned(d.zi)) actIdx.push(i); });
  // 随机抽取 TEST_SIZE 个字（不足则全部）
  const count = Math.min(TEST_SIZE, actIdx.length);
  testOrder = shuffle(actIdx).slice(0, count);
  testOptions = [];
  testAnswers = new Array(testOrder.length).fill(null);
  for (let q = 0; q < testOrder.length; q++) {
    const item = DATA[testOrder[q]];
    testOptions.push(shuffle([
      { pinyin: item.correct, isCorrect: true },
      { pinyin: item.wrong, isCorrect: false }
    ]));
  }
  testQ = 0;
  document.getElementById('testBody').style.display = 'block';
  document.getElementById('testReport').classList.remove('show');
  document.getElementById('testReport').style.display = 'none';
  renderTest();
}

function allAnswered() {
  return testAnswers.length > 0 && testAnswers.every(function (a) { return a !== null; });
}

function renderTest() {
  if (testOrder.length === 0) {
    document.getElementById('testCounter').textContent = '已全部学会 🎉';
    document.getElementById('testChar').textContent = '🎉';
    document.getElementById('testWords').innerHTML = '所有生字都已经学会啦，去「已学会」看看吧！';
    document.getElementById('testOptions').innerHTML = '';
    document.getElementById('testPrev').disabled = true;
    document.getElementById('testNext').disabled = true;
    document.getElementById('testSubmit').classList.remove('show');
    return;
  }
  const item = DATA[testOrder[testQ]];
  document.getElementById('testCounter').textContent = '第 ' + (testQ + 1) + ' 题 / 共 ' + testOrder.length + ' 题';
  document.getElementById('testChar').textContent = item.zi;
  document.getElementById('testWords').innerHTML = highlightWords(item);

  const wrap = document.getElementById('testOptions');
  wrap.innerHTML = '';
  const labels = ['A', 'B'];
  const opts = testOptions[testQ];
  const chosen = testAnswers[testQ];
  opts.forEach(function (opt, idx) {
    const btn = document.createElement('button');
    btn.className = 'opt-btn test-opt' + (chosen === idx ? ' chosen' : '');
    btn.innerHTML = '<span class="opt-label">' + labels[idx] + '</span><span class="opt-pinyin">' + opt.pinyin + '</span>';
    btn.onclick = function () { handleTestOption(idx); };
    wrap.appendChild(btn);
  });

  document.getElementById('testPrev').disabled = (testQ === 0);
  document.getElementById('testNext').disabled = (testQ === testOrder.length - 1);

  const sub = document.getElementById('testSubmit');
  if (allAnswered()) sub.classList.add('show'); else sub.classList.remove('show');
}

function handleTestOption(idx) {
  testAnswers[testQ] = idx;
  if (testQ < testOrder.length - 1) testQ++;
  renderTest();
}

function testPrev() {
  if (testQ > 0) { testQ--; renderTest(); }
}

function testNext() {
  if (testQ < testOrder.length - 1) { testQ++; renderTest(); }
}

function submitTest() {
  if (testOrder.length === 0) return;
  let correctCount = 0;
  const wrongList = [];
  const newlyLearned = [];
  for (let q = 0; q < testOrder.length; q++) {
    const item = DATA[testOrder[q]];
    const idx = testAnswers[q];
    const opt = idx === null ? null : testOptions[q][idx];
    const correct = !!(opt && opt.isCorrect);

    // 连续正确统计：连续三次测试答对 → 进入“已学会”
    if (correct) {
      STREAKS[item.zi] = (STREAKS[item.zi] || 0) + 1;
      if (STREAKS[item.zi] >= 3 && !LEARNED[item.zi]) {
        LEARNED[item.zi] = true;
        newlyLearned.push(item.zi);
      }
    } else {
      STREAKS[item.zi] = 0;
    }

    if (correct) {
      correctCount++;
    } else {
      wrongList.push({ item: item, chosen: opt ? opt.pinyin : '未作答', correct: item.correct });
    }
  }
  saveState();

  const score = Math.round(correctCount / testOrder.length * 100); // 满分 100，按答对比例计分
  document.getElementById('testBody').style.display = 'none';
  document.getElementById('testReport').classList.add('show');
  document.getElementById('testReport').style.display = 'block';

  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreSub').textContent = '答对 ' + correctCount + ' 题 / 共 ' + testOrder.length + ' 题（满分 100 分）';

  let praise = '';
  if (score === 100) praise = '🏅 拼音小达人！';
  else if (score >= 80) praise = '🥈 太厉害了，继续加油！';
  else praise = '💪 别气馁，我们再练练！';
  document.getElementById('praiseText').textContent = praise;

  const note = document.getElementById('newLearnedNote');
  if (newlyLearned.length > 0) {
    note.textContent = '🎓 本次新学会了：' + newlyLearned.join('、') + '（已进入「已学会」板块）';
  } else {
    note.textContent = '';
  }

  const wrongListEl = document.getElementById('wrongList');
  wrongListEl.innerHTML = '';
  const wrongTitle = document.getElementById('wrongTitle');
  const perfectNote = document.getElementById('perfectNote');

  if (wrongList.length === 0) {
    wrongTitle.style.display = 'none';
    perfectNote.style.display = 'block';
  } else {
    wrongTitle.style.display = 'block';
    perfectNote.style.display = 'none';
    wrongList.forEach(function (w) {
      const card = document.createElement('div');
      card.className = 'wrong-card';
      card.innerHTML =
        '<div class="wrong-head">' +
          '<span class="wrong-zi">' + w.item.zi + '</span>' +
          '<span class="wrong-line">你的答案：<span class="ur">' + w.chosen + '</span>　|　正确答案：<span class="ok">' + w.correct + '</span></span>' +
        '</div>' +
        '<div class="tip-card">' +
          '<div class="tip-title">💡 拼音小魔法（记忆法）</div>' +
          '<div class="tip-body">' + buildTip(w.item) + '</div>' +
        '</div>';
      wrongListEl.appendChild(card);
    });
  }
  renderLearned();
  renderLearn();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================= 板块三：已学会 ================= */
function renderLearned() {
  const list = DATA.filter(function (d) { return LEARNED[d.zi]; });
  document.getElementById('learnedCount').textContent = '已学会 ' + list.length + ' 个字';
  document.getElementById('clearAllBtn').disabled = (list.length === 0);
  const wrap = document.getElementById('learnedList');
  wrap.innerHTML = '';
  if (list.length === 0) {
    wrap.innerHTML = '<div class="learned-empty"><span class="big">🏆</span>还没有已学会的生字哦～<br>连续三次测试都答对，生字就会来到这里！</div>';
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'learned-grid';
  list.forEach(function (item) {
    const card = document.createElement('div');
    card.className = 'learned-card';
    card.innerHTML =
      '<div class="l-zi">' + item.zi + '</div>' +
      '<div class="l-pinyin">' + item.correct + '</div>' +
      '<div class="l-group" style="background:' + (GROUP_COLOR[item.group] || '#999') + ';">' + item.group + '</div>' +
      '<div class="l-words">' + highlightWords(item) + '</div>' +
      '<button class="remove-btn" data-zi="' + item.zi + '">🗑️ 移除</button>';
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  wrap.querySelectorAll('.remove-btn').forEach(function (btn) {
    btn.onclick = function () { removeLearned(btn.getAttribute('data-zi')); };
  });
}

function removeLearned(zi) {
  delete LEARNED[zi];
  STREAKS[zi] = 0; // 移除后重新计连续次数
  saveState();
  renderLearned();
  renderLearn();   // 该字重新回到学一学
  startTest();     // 该字重新回到测一测
}

function removeAllLearned() {
  if (Object.keys(LEARNED).length === 0) return;
  if (typeof confirm === 'function' && !confirm('确定要把已学会的生字全部移除吗？它们会重新回到「学一学」和「测一测」。')) {
    return;
  }
  LEARNED = {};
  STREAKS = {};
  saveState();
  renderLearned();
  renderLearn();   // 所有字重新回到学一学
  startTest();     // 所有字重新回到测一测
}

/* ================= 空格键：下一个 ================= */
document.addEventListener('keydown', function (e) {
  if (e.code !== 'Space') return;
  const learnPanel = document.getElementById('learnPanel');
  const nextBtn = document.getElementById('learnNext');
  if (!learnPanel.classList.contains('show')) return;   // 仅在“学一学”页生效
  if (!nextBtn.classList.contains('show')) return;      // 只有出现“下一个”时才响应
  e.preventDefault();
  // 若焦点在某个按钮上，先失焦，避免空格再触发一次点击导致跳过两题
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
    document.activeElement.blur();
  }
  nextLearn();
});

function renderMemory() {
  const wrap = document.getElementById('memorySections');
  if (!wrap) return;
  let html = '';
  MEMORY.forEach(function (sec) {
    html += '<div class="memory-section card" style="--sec:' + sec.color + '; --sec-soft:' + sec.soft + ';">';
    html += '<div class="memory-sec-head">' + sec.label + ' · ' + sec.badge + '</div>';
    html += '<div class="jingle-banner">';
    html += '<div class="jingle-label">🎵 顺口溜</div>';
    html += '<div class="jingle-text">';
    sec.jingle.forEach(function (g) { html += '<span class="jingle-pill">' + g + '</span>'; });
    html += '</div></div>';
    html += '<div class="family-grid">';
    sec.families.forEach(function (f) {
      const impCls = f.important ? ' important' : '';
      html += '<div class="family-card' + impCls + '">';
      html += '<div class="family-head">';
      html += '<div class="family-char">' + f.head + '</div>';
      html += '<div class="family-pinyin">' + f.pinyin + '</div>';
      if (f.important) html += '<span class="fam-star">⭐重点</span>';
      html += '</div>';
      html += '<div class="family-members">';
      f.members.forEach(function (m) { html += '<span class="fam-chip">' + m + '</span>'; });
      html += '</div>';
      if (f.note) html += '<div class="family-note">' + f.note + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  wrap.innerHTML = html;
}

/* ================= 初始化 ================= */
loadState();      // 先读取已学会/连续正确进度
renderMemory();   // 记一记：顺口溜字族
renderLearn();
startTest();      // 切到“测一测”前就生成题目，避免选项空白
renderLearned();
